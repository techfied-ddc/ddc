services:
  - type: web
    name: ddc-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @ddc/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: ALLOWED_ORIGINS
        value: https://desiredrycleaning.in,https://user.desiredrycleaning.in,https://store.desiredrycleaning.in,https://admin.desiredrycleaning.in

      # MongoDB
      - key: MONGODB_URI
        sync: false

      # JWT
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"

      # Redis (Upstash)
      - key: REDIS_URL
        sync: false

      # SMS (MSG91)
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        value: DSIDRYCLEAN
      - key: MSG91_TEMPLATE_ID
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Google Maps
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Web Push (VAPID)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:techfied.desiredrycleaning@gmail.com

      # Cookie
      - key: COOKIE_SECRET
        sync: false

      # Active payment provider
      - key: PAYMENT_PROVIDER
        value: razorpay
